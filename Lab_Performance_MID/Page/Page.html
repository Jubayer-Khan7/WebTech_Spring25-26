<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
   <div class="wrapper">
        <fieldset class="box">
            <legend>Product Management Page</legend>

            <label>Unit Price:</label>
            <input type="number" value="1000" readonly>

            <label>Quantity per Day:</label>
            <input type="number" id="quantity" placeholder="Enter quantity per day">
            <p id="errorMsg" class="error"></p>

            <label>Total Price for 30 Days:</label>
            <input type="number" id="total" value="0" readonly>
        </fieldset>
    </div>

</body>
</html>
