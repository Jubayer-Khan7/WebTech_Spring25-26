<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Product Management Page </title>
    <link rel="stylesheet" href="/Lab_Performance_MID/Design/Style.css">
</head>
<body>
    <body>
   <div class="wrapper">
        <fieldset class="box">
            <legend>Product Management Page</legend>

            <label>Unit Price:</label>
            <input type="number" value="1000" readonly>

            <label>Quantity per Day:</label>
            <input type="number" id="quantity" placeholder="Enter quantity per day">
            <p id="errorMsg" class="error"></p>

            <label>Total Price for 30 Days:</label>
            <input type="number" id="total" value="0" readonly>
        </fieldset>
    </div>
    <script src="/Lab_Performance_MID/JS/Validation.js"></script>
</body>
</html>
